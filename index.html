const NOTES=[
{id:'ruhe-guankan-yike-shu',title:'如何观看一棵树',src:'Tim Ingold',date:'2026-07-28',m:'07月',excerpt:'「观察不是接收信息，而是与事物共处一段时间。」——这恰是写好代码也需要的姿态。',tags:['阅读','工艺'],read:'6 分钟',
body:`## 观察不是接收
我们以为"看"是眼睛把对象的特征抓取进来，像扫描仪。但 Ingold 说，树不是一张待读取的图像，而是一个正在生长的过程——你得跟着它的时间走，才"看"得见它。

> 观察不是接收信息，而是与事物共处一段时间。
> —— Tim Ingold，《如何观看一棵树》

## 与事物共处
所谓共处，是把自己交给对象本身的节奏。风过时枝叶如何摆动，雨后树皮的颜色怎样变深，这些都不是一瞥能得的信息，而是相处出来的认识。

### 三种"看"的差别
- **扫视**：抓取特征，快速分类——这是广告牌式的看
- **检视**：按图索骥，核对清单——这是质检员式的看
- **共处**：跟随对象的时间，让它向你显现——这是 Ingold 说的看

## 写代码的姿态
这与写好代码何其相似。一个好接口不是一眼能看穿的"特征清单"，它是在反复使用中、在与它共处的时间里，慢慢显出好坏的。急着评判，往往错过真正的问题。

我曾在一个项目里，初见某段 API 设计便觉得冗余，随手重写。三个月后需求变化，才明白那点"冗余"正是给未来留的弹性。我没和它共处足够久，就下了判决。

> 好的判断需要时间，而时间是最被低估的设计工具。

## 尾声
于是青灯之下，黄卷之间，多停一会儿，也许就是全部的秘密。`},

{id:'jiangren',title:'匠人',src:'Richard Sennett',date:'2026-07-14',m:'07月',excerpt:'把一件事做好的冲动，本身就是一种秩序感。重读第三章关于「阻抗」的论述。',tags:['工艺','阅读'],read:'8 分钟',
body:`## 把事情做好
Sennett 在《匠人》里反复强调一个朴素的命题：把一件事做好的冲动，本身具有道德意义。它不指向外在的奖赏，而是一种内在的秩序感——当材料在你手中逐渐成形，你和世界之间达成了一种暂时的和解。

## 阻抗
第三章谈到"阻抗"。匠人与材料的关系不是单向的征服，材料会抵抗，而抵抗恰恰是对话的开始。

> 阻抗不是障碍，是对话。

木匠遇到一块纹理不顺的木头，不是强行刨平，而是顺纹下刀。这块"不顺"的木头，反过来教会了木匠什么是顺。

## 工具的延伸
工具是身体的延伸，更是心智的外化。一把用顺手的凿子，握着它时你不会想到"我在使用工具"，它已经成了手的一部分。这种物我两忘的状态，Sennett 称之为"物质意识"——通过物来思考，而非关于物来思考。

## 与代码的类比
写代码也是一种匠作。变量命名、函数拆分、模块边界，这些看似琐碎的"手艺活"，决定了代码是结实的还是脆弱的。一个在乎这些细节的程序员，和一个不在乎的，写出的东西会慢慢变成两种世界。

### 匠人的三个标志
- 愿意为细节多花时间，因为细节就是内容
- 对材料有敬意，哪怕材料只是文本
- 接受"重做"，不把第一次的产出当作终点

## 尾声
青灯黄卷，本就是匠人的姿态。不为发表，不为点赞，只为把读到的东西，好好留下一笔。`},

{id:'changri-jiangjin',title:'长日将尽',src:'石黑一雄',date:'2026-07-02',m:'07月',excerpt:'克制是一种美德，无论在句子还是在界面里。关于「留白即陈述」的笔记。',tags:['阅读','城市'],read:'5 分钟',
body:`## 克制的艺术
石黑一雄的笔调是克制的典范。在《长日将尽》里，管家史蒂文斯用最得体的措辞，讲述着一生的遗憾。越是重大的情感，他越是用职业化的语言绕开它——而正是这种绕开，让读者听见了他没说出口的一切。

## 留白即陈述
好的表达常常是这样：不说的部分，比说的部分更有力。这就是"留白即陈述"。

> 真正想说的话，往往藏在那些没说出口的句子里。

## 界面里的克制
这个道理在界面设计里同样成立。一个界面越是想强调什么，越容易把它做满、做大、加红加粗。但真正自信的设计，敢留白，敢让一个区域安静下来。

- 弹窗满天飞的产品，往往不知道自己最想说什么
- 一个克制的首页，三句话讲清"我是谁、我能给你什么"
- 强调色只用在一处，比用在五处都显眼

## 史蒂文斯的得体
史蒂文斯的悲剧在于，他把"得体"做到了极致，却因此错过了人生。这提醒我们：克制是手段，不是目的。过度克制，会把自己也克制掉。

## 尾声
读到最后一页，史蒂文斯在码头等灯亮起。那一刻，所有的克制都化成了怅惘。好书就是这样，它不告诉你该怎么做，它只让你在别人的故事里，看见自己的影子。`},

{id:'lun-sheying',title:'论摄影',src:'苏珊·桑塔格',date:'2026-06-18',m:'06月',excerpt:'拍照是一种软性的占有。我们用相机代替记忆，于是记忆开始退场。',tags:['阅读','随想'],read:'7 分钟',
body:`## 拍照即占有
桑塔格在《论摄影》开篇就给了我们一记警钟：拍照是一种软性的占有。当我们举起相机，自以为在"记录"世界，其实是在把它据为己有——把流动的瞬间，冻结成一个可以随身携带的物件。

## 相机代替记忆
更深的隐忧在于：当我们把记忆外包给照片，记忆本身就开始退场。

> 我们用相机代替记忆，于是记忆开始退场。

多少人旅行归来，相册存了几百张，却想不起当时风的方向、空气的味道？照片替我们"记住"了，于是我们理直气壮地"忘记"了。

## 观看的伦理
桑塔格提醒我们，拍摄者与被拍摄者之间，存在一种权力关系。镜头永远在"选取"，而选取本身就是一种判断——判断什么值得被看见，什么可以被略去。

## 与写作的对照
写作何尝不是如此。一个写作者也在"选取"，也在用文字占有他经历的世界。差别在于，文字需要重新经历一遍，而照片只需按下快门。所以写作的记忆，往往比照片更深——因为你必须真的想起来，才能写下来。

## 尾声
合上书，我决定这一周出门不带相机。让风只是风，让光只是光，让记忆自己来，自己走。`},
];

{id:'yuye-de-bianlidian',title:'雨夜的便利店',src:'',date:'2026-07-21',m:'07月',excerpt:'凌晨两点，关东煮的热气和玻璃上的雨。城市在这些缝隙里才显出温度。',tags:['城市','随想'],read:'4 分钟',
body:`## 凌晨两点
雨从十一点开始下，到我推门进便利店时，已经下了三个小时。凌晨两点的全家，灯比白天还亮，亮得有些不真实。

## 关东煮
收银台后面，关东煮的锅咕嘟咕嘟冒着热气。萝卜、鸡蛋、魔芋，在琥珀色的汤里轻轻晃动。我点了一份萝卜，店员用漏勺捞起来时，热气扑到我脸上，混着玻璃门外的凉雨。

> 城市在这些缝隙里才显出温度。

## 玻璃上的雨
我坐在靠窗的位置吃。雨水顺着玻璃往下流，把外面的霓虹灯晕成一团一团的颜色。红绿灯变了又变，没有车经过。

## 另一个夜归人
门铃响了，进来一个穿外卖服的人。他买了一瓶热咖啡，站在门口喝了几口，又冲进雨里。他的电动车灯在雨幕里划出一道短暂的光，然后消失。

## 尾声
吃完萝卜，汤也喝了。雨小了一些。我推门出去，凉意重新裹上来，但胃里是暖的。便利店的灯在身后亮着，像一艘夜航船上，不肯熄灭的灯。`},

{id:'guanyu-man-de-shibai-lianxi',title:'关于「慢」的一次失败练习',src:'',date:'2026-07-09',m:'07月',excerpt:'试着一周不刷信息流，结果只是把焦虑换了个形状。记录这个过程。',tags:['随想'],read:'6 分钟',
body:`## 一个决定
某个周一的早晨，我删掉了手机里所有的资讯 App，决定用一周时间练习"慢"。我设想的画面是：读书、散步、发呆，心如止水。

## 第一天：亢奋
第一天出乎意料地好。没有信息流的干扰，我读完了半本书，还去公园走了两圈。我以为自己已经是个"慢"的人了。

## 第三天：裂缝
到第三天，裂缝出现了。我开始频繁地打开浏览器，刷新邮箱，甚至把冰箱里的食材重新排列了一遍。焦虑没有消失，它只是换了一个出口。

> 慢不是不做事，而是不急着做完。

## 第五天：诚实
第五天我不得不承认：我以为的"慢"，不过是换了形式的忙。我把刷信息流换成了刷书架，把焦虑地看新闻换成了焦虑地看日历。问题的根源不在于快慢，而在于我总在"赶"——赶着把生活过成某种样子。

## 真正的慢
真正的慢，是允许事情有自己的时间。一篇文章不用一天写完，一顿饭不用十分钟解决，一段关系不用三个月见分晓。慢不是效率的反义词，而是"赶"的反义词。

## 尾声
第七天，我把 App 装了回来。但我学会了一件事：当焦虑升起时，先停一停，问自己——我是在做事，还是在赶路？这两者，差之毫厘，谬以千里。`},

{id:'banjia-qian-de-zuihou-yici-sanbu',title:'搬家前的最后一次散步',src:'',date:'2026-06-27',m:'06月',excerpt:'沿着熟悉到闭上眼都能走的路线，再走一遍。每棵行道树都成了告别。',tags:['城市','生活'],read:'5 分钟',
body:`## 一条走了六年的路
下个月要搬家了。这条从家到公司的路，我走了六年，熟悉到闭上眼都能走。搬家前的最后一个傍晚，我决定再走一遍。

## 行道树
路两边的法国梧桐，六年里长高了不少。它们的根把人行道的地砖顶得参差不齐，我曾无数次绊脚，如今却觉得那些翘起的地砖，是这条路特有的纹理。

> 每棵行道树都成了告别。

## 熟悉的店
修鞋的老大爷还在路口，他的摊位换了三次位置，人却没变。我蹲下来和他聊了几句，他说这条路要拓宽了，他可能也要搬。原来告别的不只是我。

## 转角
转到公司那个转角时，夕阳正好从两栋楼之间照过来，把整条街染成金色。我见过这个画面上百次，但今天它格外清晰——因为知道是最后一次。

## 尾声
走到公司门口，我没有进去，而是转身往回走。回程的路，我走得很慢。风吹过梧桐叶，沙沙地响，像是这条路在和我说话。我忽然明白，所谓"住过的地方"，不是那间房子，而是这一路的树、光、和转角。`},
];

{title:'墨痕 · 排印实验',desc:'一个用 Canvas 模拟毛笔起笔、行笔、收笔的小工具。试着在屏幕上写出有"骨"的字。',cls:'t1',links:['GitHub','线上 Demo'],body:`## 关于墨痕
墨痕源于一个朴素的疑问：为什么屏幕上的字，总少了纸上的那种"骨"？

我开始研究毛笔的力学——起笔的顿、行笔的提按、收笔的回锋。把这些力学简化成几个参数，用 Canvas 的压感曲线去模拟，于是有了墨痕。

### 技术要点
- 用 \`\`quadraticCurveTo\`\` 拟合笔画的弧度
- 根据速度反推压力，慢则粗、快则细
- 飞白效果用噪声扰动透明度实现

## 它教会我的
做墨痕的过程，让我重新理解了"书写"。每一个字都不是线条的组合，而是力的记录。屏幕未必输给纸，关键在于你有没有把那股"力"算进去。`},

{title:'夜读 · 暗色主题集',desc:'为常见文档站做的偏暖暗色主题。拒绝纯黑，用夜墨的温度护眼。',cls:'t3',links:['GitHub','VS Code 插件'],body:`## 关于夜读
市面上的暗色主题，多半是纯黑底配冷灰字，看久了眼睛发凉。夜读反其道而行——底色用偏暖的夜墨色，文字用月白，强调色用提亮的朱砂。

{title:'青灯 · 本站',desc:'即此站本身。Astro + Markdown，水墨文学风，写完即发。',cls:'t4',links:['GitHub','关于本站'],body:`## 关于青灯

{title:'卷尺 · 阅读时长统计',desc:'一个极简的阅读计时器，读完一本书，留下一条时间线。',cls:'t1',links:['GitHub'],body:`## 关于卷尺

const views={home:'view-home',list:'view-list',article:'view-article',search:'view-search',about:'view-about'};

function show(name){
  Object.values(views).forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(views[name]).classList.add('active');
  document.getElementById('progBar').style.display = name==='article'?'block':'none';
  window.scrollTo({top:0,behavior:'instant'});
  // 顶栏高亮
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));
  const navMap={home:'home',essays:'essays',works:'works',about:'about'};
  if(navMap[name])document.querySelector(`.nav a[data-go="${navMap[name]}"]`)?.classList.add('active');
  if(name==='article')document.querySelector('.nav a[data-go="home"]')?.classList.add('active');
  document.getElementById('nav').classList.remove('open');
}

function go(target,opts={}){
  if(target==='home'){show('home');renderHome();}
  else if(target==='essays'){show('list');renderList('essays');}
  else if(target==='works'){show('list');renderList('works');}
  else if(target==='about'){show('about');renderAbout();}
  else if(target==='search'){show('search');setTimeout(()=>document.getElementById('searchInput').focus(),50);}
}

document.querySelectorAll('[data-go]').forEach(el=>{
  el.addEventListener('click',e=>{e.preventDefault();go(el.getAttribute('data-go'));});
});

/* ====== 首页 ====== */
function cardHTML(it,section){
  return `<div class="card" data-open="${section}/${it.id}">
    <div class="card-date"><span class="d">${it.date.slice(8)}</span><span class="m">${it.m}</span></div>
    <div class="card-body">
      <div class="card-title">${it.title}${it.src?`<span class="src">· ${it.src}</span>`:''}</div>
      <div class="card-excerpt">${it.excerpt}</div>
      <div class="tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div></div>`;
}
function renderHome(){
  document.getElementById('panel-notes').innerHTML=NOTES.slice(0,4).map(it=>cardHTML(it,'notes')).join('');
  document.getElementById('panel-essays').innerHTML=ESSAYS.slice(0,3).map(it=>cardHTML(it,'essays')).join('');
  document.getElementById('panel-works').innerHTML=`<div class="work-grid">${WORKS.map((w,i)=>`<div class="work" data-open="works/${i}"><div class="work-thumb ${w.cls}"></div><div class="work-info"><h4>${w.title}</h4><p>${w.desc}</p><div class="work-links">${w.links.map(l=>`<span>${l}</span>`).join('')}</div></div></div>`).join('')}</div>`;
  bindOpens();
  document.querySelectorAll('[data-list]').forEach(a=>a.addEventListener('click',()=>{renderList(a.getAttribute('data-list'));show('list');}));
}


/* ====== 列表 ====== */
function renderList(section){
  const cfg={notes:{crumb:'阅读札记',title:'札记',desc:'书评、摘抄与批注。为读过的书，留一笔朱批。'},essays:{crumb:'随笔·生活',title:'随笔',desc:'非技术的所思所感。城市、生活、与一些不着边际的念头。'},works:{crumb:'作品集',title:'作品',desc:'写代码也是一种手艺。这里是我做的些小东西。'}};
  const c=cfg[section];
  document.getElementById('listCrumb').textContent=c.crumb;
  document.getElementById('listTitle').textContent=c.title;
  document.getElementById('listDesc').textContent=c.desc;
  const box=document.getElementById('listCards');
  if(section==='works'){
    box.innerHTML=`<div class="work-grid">${WORKS.map((w,i)=>`<div class="work" data-open="works/${i}"><div class="work-thumb ${w.cls}"></div><div class="work-info"><h4>${w.title}</h4><p>${w.desc}</p><div class="work-links">${w.links.map(l=>`<span>${l}</span>`).join('')}</div></div></div>`).join('')}</div>`;
  }else{
    const arr=section==='notes'?NOTES:ESSAYS;
    box.innerHTML=arr.map(it=>cardHTML(it,section)).join('');
  }
  bindOpens();
}

/* ====== 文章详情 ====== */
function md(t){return t
  .replace(/^## (.+)$/gm,'<h2>$1</h2>')
  .replace(/^### (.+)$/gm,'<h3>$1</h3>')
  .replace(/^> (.+?)$/gm,'<blockquote>$1</blockquote>')
  .replace(/^- (.+)$/gm,'<li>$1</li>')
  .replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`)
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/\*(.+?)\*/g,'<em>$1</em>')
  .replace(/`(.+?)`/g,'<code>$1</code>')
  .replace(/\n{2,}/g,'</p><p>')
  .replace(/^(?!<[hbu])/,  '<p>')
  .replace(/$/,'</p>')
  .replace(/<p><h2/g,'<h2').replace(/<\/h2><\/p>/g,'</h2>')
  .replace(/<p><h3/g,'<h3').replace(/<\/h3><\/p>/g,'</h3>')
  .replace(/<p><ul/g,'<ul').replace(/<\/ul><\/p>/g,'</ul>')
  .replace(/<p><blockquote/g,'<blockquote').replace(/<\/blockquote><\/p>/g,'</blockquote>')
  .replace(/<p><\/p>/g,'');}

function openArticle(section,id){
  const arr=section==='notes'?NOTES:section==='essays'?ESSAYS:null;
  if(!arr)return;
  const it=arr.find(x=>x.id===id);if(!it)return;
  const cfg={notes:'阅读札记',essays:'随笔·生活'};
  document.getElementById('articleHead').innerHTML=`
    <div class="crumb">${cfg[section]} / ${it.date}</div>
    <h1>${it.title}</h1>
    <div class="by">${it.date} · 约 ${it.read}${it.src?`<span class="src">· ${it.src}</span>`:''}</div>
    <div class="atags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
  const bodyHTML=md(it.body);
  document.getElementById('articleBody').innerHTML=bodyHTML;
  // TOC
  const heads=[...document.querySelectorAll('#articleBody h2')];
  const toc=document.getElementById('articleToc');
  let tocHTML='<div class="tt">目　录</div>';
  heads.forEach((h,i)=>{h.id='h'+i;tocHTML+=`<a data-t="h${i}">${h.textContent}</a>`;});
  toc.innerHTML=tocHTML;
  // prev/next
  const idx=arr.indexOf(it);
  const prev=idx>0?arr[idx-1]:null;
  const next=idx<arr.length-1?arr[idx+1]:null;
  document.getElementById('articleFoot').innerHTML=`
    <div class="pager">${prev?`<a data-open="${section}/${prev.id}">← ${prev.title}</a>`:'<span></span>'}${next?`<a data-open="${section}/${next.id}">${next.title} →</a>`:''}</div>
    <div class="readinfo">最后修订 ${it.date} · 约 ${it.read}</div>`;
  bindOpens();
  tocScroll();
  show('article');
}

function openWork(i){
  const w=WORKS[i];if(!w)return;
  document.getElementById('articleHead').innerHTML=`
    <div class="crumb">作品集 / ${w.title}</div>
    <h1>${w.title}</h1>
    <div class="by">${w.links.join(' · ')}</div>
    <div class="atags"><span class="tag">作品</span></div>`;
  document.getElementById('articleBody').innerHTML=md(w.body);
  document.getElementById('articleToc').innerHTML='<div class="tt">目　录</div>';
  const heads=[...document.querySelectorAll('#articleBody h2')];
  let h='<div class="tt">目　录</div>';
  heads.forEach((hd,k)=>{hd.id='h'+k;h+=`<a data-t="h${k}">${hd.textContent}</a>`;});
  document.getElementById('articleToc').innerHTML=h;
  document.getElementById('articleFoot').innerHTML=`<div class="pager"><a data-go="works">← 返回作品集</a></div><div class="readinfo">${w.title}</div>`;
  bindOpens();
  tocScroll();
  show('article');
}

function bindOpens(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick=()=>{const v=el.getAttribute('data-open').split('/');if(v[0]==='works')openWork(+v[1]);else openArticle(v[0],v[1]);};
  });
}

function tocScroll(){
  const links=[...document.querySelectorAll('#articleToc a')];
  links.forEach(a=>a.onclick=()=>{const t=document.getElementById(a.getAttribute('data-t'));if(t)window.scrollTo({top:t.offsetTop-80,behavior:'smooth'});});
  function onScroll(){
    if(!document.getElementById('view-article').classList.contains('active'))return;
    const art=document.getElementById('articleBody');
    const r=art.getBoundingClientRect();
    const vh=window.innerHeight;
    const ratio=Math.max(0,Math.min(1,(vh-r.top)/(r.height||1)));
    document.getElementById('progFill').style.width=(ratio*100).toFixed(1)+'%';
    const heads=links.map(l=>document.getElementById(l.getAttribute('data-t'))).filter(Boolean);
    let active=heads[0]?heads[0].id:null;
    const line=vh*0.4;
    heads.forEach(h=>{if(h.getBoundingClientRect().top<=line)active=h.id;});
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('data-t')===active));
  }
  window.onscroll=onScroll;onScroll();
}

/* ====== 搜索 ====== */
const allItems=[...NOTES.map(x=>({...x,sec:'札记',sk:'notes'})),...ESSAYS.map(x=>({...x,sec:'随笔',sk:'essays'}))];
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.trim();
  const box=document.getElementById('searchResults');
  const meta=document.getElementById('searchMeta');
  if(!q){box.innerHTML='';meta.textContent='输入关键词，搜索全部札记与随笔。';return;}
  const ql=q.toLowerCase();
  const res=allItems.filter(it=>(it.title+it.excerpt+it.tags.join('')+(it.src||'')).toLowerCase().includes(ql));
  meta.textContent=`${res.length} 条结果 · 关键词「${q}」`;
  if(!res.length){box.innerHTML=`<div class="search-empty">未找到「${q}」相关的内容<br>换个词试试？</div>`;return;}
  function hl(t){return t.replace(new RegExp(q,'gi'),m=>`<b>${m}</b>`);}
  box.innerHTML=res.map(it=>`<div class="sr-item" data-open="${it.sk}/${it.id}">
    <div class="st">${hl(it.title)}<span class="sec">${it.sec}${it.src?' · '+it.src:''}</span></div>
    <div class="ss">${hl(it.excerpt)}</div></div>`).join('');
  bindOpens();
});

/* ====== 明暗 ====== */
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('qd-theme',t)}catch(e){}
  document.getElementById('themeIcon').innerHTML = t==='dark'
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  const c=document.documentElement.getAttribute('data-theme');
  setTheme(c==='dark'?'light':'dark');
});
(function(){let s=null;try{s=localStorage.getItem('qd-theme')}catch(e){}
  if(s)setTheme(s);else if(matchMedia('(prefers-color-scheme: dark)').matches)setTheme('dark');})();

renderHome();
